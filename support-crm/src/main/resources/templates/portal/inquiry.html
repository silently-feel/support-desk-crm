<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Submit Support Ticket | Customer Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

<nav class="navbar navbar-dark bg-dark py-3">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/portal/inquiry"><i class="bi bi-shield-check text-primary me-2"></i>SupportDesk Portal</a>
        <a href="/portal/track" class="btn btn-outline-light btn-sm rounded-pill"><i class="bi bi-search me-1"></i>Track Inquiry</a>
    </div>
</nav>

<div class="container my-auto py-5" style="max-width: 600px;">
    <div th:if="${createdRef}" class="alert alert-success p-4 rounded-4 shadow-sm mb-4 text-center">
        <i class="bi bi-check-circle-fill fs-1 text-success d-block mb-2"></i>
        <h4 class="fw-bold">Inquiry Registered!</h4>
        <p class="mb-2">Your complaint tracking reference ID is:</p>
        <span class="badge bg-primary fs-5 font-monospace px-3 py-2" th:text="${createdRef}">TKT-001</span>
        <div class="mt-3">
            <a th:href="@{'/portal/track?ref=' + ${createdRef}}" class="btn btn-outline-primary btn-sm rounded-pill">View Live Status</a>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
        <h2 class="h4 fw-bold mb-1">Submit an Inquiry</h2>
        <p class="text-muted small mb-4">Provide the details of your issue and an agent will assist shortly.</p>

        <form th:action="@{/portal/inquiry}" th:object="${ticketRequest}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Your Name</label>
                <input type="text" th:field="*{customer_name}" class="form-control" placeholder="Aarav Sharma" required />
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold">Email Address (For Reference Confirmation)</label>
                <input type="email" th:field="*{customer_email}" class="form-control" placeholder="aarav@example.com" required />
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold">Subject</label>
                <input type="text" th:field="*{subject}" class="form-control" placeholder="UPI Autopay mandate failure" required />
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold">Issue Description</label>
                <textarea rows="4" th:field="*{description}" class="form-control" placeholder="Explain the symptoms or error codes..." required></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2.5 fw-semibold shadow-sm">
                Submit Complaint <i class="bi bi-send ms-1"></i>
            </button>
        </form>
    </div>
</div>
</body>
</html>
