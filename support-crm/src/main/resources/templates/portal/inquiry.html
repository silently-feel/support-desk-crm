<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Support Ticket | Customer Portal</title>
    <!-- Blue Shield Tab Logo -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230d6efd'%3E%3Cpath d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z'/%3E%3C/svg%3E">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; min-height: 100vh; }
        .navbar-custom { background-color: #0f172a; border-bottom: 1px solid #1e293b; }
        .card-surface { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="d-flex flex-column">

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/portal/inquiry">
            <span class="bg-primary text-white p-2 rounded-3 d-inline-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                <i class="bi bi-shield-check"></i>
            </span>
            <span>SupportDesk <span class="badge bg-secondary-subtle text-light-emphasis small fw-normal ms-1">Customer Portal</span></span>
        </a>
        <a href="/portal/track" class="btn btn-outline-light btn-sm rounded-pill px-3">
            <i class="bi bi-search me-1"></i> Track Ticket
        </a>
    </div>
</nav>

<div class="container my-auto py-5" style="max-width: 640px;">
    <!-- Success Banner -->
    <div th:if="${createdRef}" class="alert alert-success p-4 rounded-4 shadow-sm mb-4 text-center border-0 bg-white">
        <i class="bi bi-check-circle-fill fs-1 text-success d-block mb-2"></i>
        <h4 class="fw-bold text-dark">Inquiry Registered Successfully!</h4>
        <p class="text-muted small mb-2">Your complaint tracking reference ID is:</p>
        <span class="badge bg-primary fs-5 font-monospace px-3 py-2" th:text="${createdRef}">TKT-001</span>
        <div class="mt-3">
            <a th:href="@{'/portal/track?ref=' + ${createdRef}}" class="btn btn-outline-primary btn-sm rounded-pill px-4">
                <i class="bi bi-clock-history me-1"></i> View Live Ticket Status
            </a>
        </div>
    </div>

    <!-- Inquiry Submission Form -->
    <div class="card-surface p-4 p-md-5">
        <div class="mb-4">
            <h1 class="h4 fw-bold text-dark mb-1">Submit a Support Inquiry</h1>
            <p class="text-muted small">Provide the details of your issue and an operator will triage your request promptly.</p>
        </div>

        <form th:action="@{/portal/inquiry}" th:object="${ticketRequest}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Your Name</label>
                <input type="text" th:field="*{customer_name}" class="form-control" placeholder="Aarav Sharma" required />
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Email Address (For Reference Confirmation)</label>
                <input type="email" th:field="*{customer_email}" class="form-control" placeholder="aarav@example.com" required />
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Subject</label>
                <input type="text" th:field="*{subject}" class="form-control" placeholder="Brief summary of the inquiry" required />
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold text-secondary">Issue Description</label>
                <textarea rows="4" th:field="*{description}" class="form-control" placeholder="Explain the symptoms, error codes, or context..." required></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2.5 fw-semibold shadow-sm">
                Submit Inquiry <i class="bi bi-send ms-1"></i>
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
