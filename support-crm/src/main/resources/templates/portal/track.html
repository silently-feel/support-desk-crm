<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Ticket Status | Customer Portal</title>
    <!-- Blue Shield Tab Logo -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230d6efd'%3E%3Cpath d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z'/%3E%3C/svg%3E">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; min-height: 100vh; }
        .navbar-custom { background-color: #0f172a; border-bottom: 1px solid #1e293b; }
        .card-surface { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="d-flex flex-column">

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/portal/inquiry">
            <span class="bg-primary text-white p-2 rounded-3 d-inline-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                <i class="bi bi-shield-check"></i>
            </span>
            <span>SupportDesk <span class="badge bg-secondary-subtle text-light-emphasis small fw-normal ms-1">Customer Portal</span></span>
        </a>
        <a href="/portal/inquiry" class="btn btn-outline-light btn-sm rounded-pill px-3">
            <i class="bi bi-plus-circle me-1"></i> New Inquiry
        </a>
    </div>
</nav>

<div class="container my-auto py-5" style="max-width: 650px;">
    <!-- Search Box -->
    <div class="card-surface p-4 mb-4">
        <h2 class="h5 fw-bold text-dark mb-3">Track Your Complaint Status</h2>
        <form method="get" action="/portal/track" class="input-group">
            <input type="text" name="ref" class="form-control font-monospace" placeholder="Enter Ref ID e.g. TKT-001" th:value="${searchedRef}" required />
            <button class="btn btn-primary px-4 fw-semibold" type="submit"><i class="bi bi-search me-1"></i> Track</button>
        </form>
    </div>

    <!-- Not Found Alert -->
    <div th:if="${notFound}" class="alert alert-danger rounded-4 shadow-sm text-center py-3 border-0">
        <i class="bi bi-exclamation-triangle-fill me-1"></i> No ticket found matching that reference ID. Please check and try again.
    </div>

    <!-- Ticket Detail Result -->
    <div th:if="${ticket}" class="card-surface p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="badge bg-light text-primary border font-monospace px-3 py-2 fs-6" th:text="${ticket.ticket_id}">TKT-001</span>
            <span class="badge px-3 py-2 rounded-pill fs-6"
                  th:classappend="${ticket.status.name() == 'CLOSED' ? 'bg-success text-white' : (ticket.status.name() == 'IN_PROGRESS' ? 'bg-warning text-dark' : 'bg-primary text-white')}"
                  th:text="${ticket.status}">OPEN</span>
        </div>
        <h3 class="h5 fw-bold text-dark mb-2" th:text="${ticket.subject}">Subject</h3>
        <p class="text-muted small border-bottom pb-3" th:text="${ticket.description}">Description</p>

        <h4 class="h6 fw-bold text-uppercase text-secondary mb-3" style="font-size: 0.75rem;">Progress Notes & Updates</h4>
        <div th:if="${not #lists.isEmpty(ticket.notes)}">
            <div th:each="n : ${ticket.notes}" class="p-3 bg-light rounded-3 mb-2 border-start border-3 border-primary">
                <div class="small text-muted mb-1" th:text="${#temporals.format(n.created_at, 'dd MMM yyyy, hh:mm a')}">Time</div>
                <div class="text-dark small" th:text="${n.note_text}">Note</div>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(ticket.notes)}" class="text-muted small fst-italic py-2 text-center">
            No agent updates logged yet. Your ticket is currently queued for assignment.
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
